services:
  mariadb:
    image: mariadb:inception
    container_name: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    secrets:
      - db_passwd
      - db_root_passwd
    restart: always

  wordpress:
    image: wordpress:inception
    container_name: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER} 
      WP_USER_EMAIL: ${WP_USER_EMAIL}
    secrets:
      - db_passwd
      - wp_admin_passwd
      - wp_user_passwd
    depends_on:
      - mariadb
    restart: always

  nginx:
    image: nginx:inception
    container_name: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html:ro
    depends_on:
      - wordpress
    ports:
      - "443:443"
    restart: always


volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hkemmoun/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hkemmoun/data/wordpress

networks:
  inception:
    driver: bridge

secrets:
  db_passwd:
    environment: MYSQL_PASSWORD

  db_root_passwd:
    environment: MYSQL_ROOT_PASSWORD

  wp_admin_passwd:
    environment: WP_ADMIN_PASSWORD
  
  wp_user_passwd:
    environment: WP_USER_PASSWORD
